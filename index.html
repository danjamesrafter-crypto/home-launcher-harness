<!doctype html>

<title>Flywheel Home (launcher harness)</title>
<!--
  Flywheel Home launcher harness. Spike harness, not the product.
  Built on the Flywheel Vision Design System (vision-react bundle, tokens, icon font), copied into ./vision/.
  Runs as a Flywheel extension app (Viewer type) and reads data through the Extension SDK's apiRequest proxy,
  so the page never sees a token. Read-only: it makes no write calls.
  Contains no data. Open with #demo to run on fictional sample data.
-->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="bundle.css">
<link rel="stylesheet" href="vision-icons.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="root"><p style="padding:24px">Connecting to Flywheel…</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="vision-components.js"></script>
<script src="https://cdn.flywheel.io/sdk/extension/flywheel-extension-0.14.9.min.js"></script>
<script src="app.js"></script>
</body>
</html>
